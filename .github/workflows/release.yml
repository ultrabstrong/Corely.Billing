name: Release

# Publishes to NuGet via Trusted Publishing (OIDC). There is no API key stored anywhere: the
# workflow proves its identity to nuget.org, which checks it against the trusted publisher policy
# bound to this repository and hands back a key valid for one hour.
#
# The policy is bound to this file name (release.yml) - renaming it breaks publishing until the
# policy on nuget.org is updated to match.
#
#   git tag v2.3.0 && git push origin v2.3.0
#
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # required for nuget.org to issue the short-lived key

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # version check compares against the last release tag

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Publishing an unbumped package skips it as a duplicate and still reports success.
      - name: Package versions
        run: STRICT=1 bash scripts/check-package-versions.sh

      - name: Restore
        run: dotnet restore Corely.Billing.slnx

      - name: Build
        run: dotnet build Corely.Billing.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution Corely.Billing.slnx --configuration Release --no-build

      # Version comes from the csproj, matching how these packages have always been versioned.
      # The tag is the trigger, not the source of truth.
      - name: Pack
        run: >
          dotnet pack Corely.Billing/Corely.Billing.csproj
          --configuration Release
          --no-build
          -p:IncludeSymbols=true
          -p:SymbolPackageFormat=snupkg
          --output ./artifacts

      - name: List packages
        run: ls -l ./artifacts

      # Requested immediately before the push: the key expires after one hour.
      - name: NuGet login (OIDC to short-lived key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ultrabstrong

      - name: Push
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: ./artifacts/*
